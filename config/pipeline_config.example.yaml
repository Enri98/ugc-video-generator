# Copy to `pipeline_config.yaml` and adjust. 
#
# This file's key layout matches what the orchestrator actually reads
# (parallelism.*, budget.*, veo.*, post_production.*, paths.*, logging.*,
# cleanup.*). Do not rename keys without updating the orchestrator.

version: "1.0.0"

poll:
  interval_seconds: 300        # ignored in v1 (one-shot mode); reserved for daemon mode

parallelism:
  max_concurrent_products: 2
  max_concurrent_veo_ops: 4

retry:
  max_attempts: 5
  base_delay_seconds: 2
  max_delay_seconds: 60

veo:
  model: "veo-3.1-fast-generate-preview"   # google-genai 2.x model id; tune to your tier
  poll_interval_seconds: 15
  poll_timeout_seconds: 360    # 6 minutes; Veo ops typically complete in 90-300s
  aspect_ratio: "9:16"         # passed to Veo submit
  resolution: "720p"           # Veo 3.1 Fast output resolution
  duration_seconds: 8          # per-clip length; Veo 3.1 Fast supports 5-8s
  person_generation: "allow_adult"   # required when first-frame contains an adult human
  generate_audio: true               # Veo 3.1 native speech + ambient audio. Set false to fall back to silent video if your tier rejects audio requests.

gemini:
  rpm: 60                      # Gemini 2.5 Pro requests per minute (proactive aiolimiter cap)

nano_banana:
  # Default works in us-central1 (Nano Banana 1 / Gemini 2.5 Flash Image, GA).
  # To use Gemini 3 Pro Image Preview ("Nano Banana 2"), uncomment both lines:
  #   model: "gemini-3-pro-image-preview"
  #   location: "global"
  model: "gemini-2.5-flash-image"
  # location: <inherits GOOGLE_CLOUD_LOCATION when unset>
  rpm: 30                      # Nano Banana requests per minute (proactive aiolimiter cap)

budget:
  per_video_max_usd: 8.00
  global_max_usd: 50.00
  max_cost_per_clip_usd: 0.60  # used for admission control worst-case estimate

post_production:
  trim_tail_seconds: 0.5
  caption_max_chars_per_line: 30   # tighter wrapping for 720px-wide vertical
  video_width: 720             # final video pixel width (must match Veo output)
  video_height: 1280           # final video pixel height (9:16 vertical)
  caption_font: "Arial"
  caption_font_size: 44        # scaled down for 720p vs 1080p

cleanup:
  keep_raw_clips: false
  keep_trimmed_clips: false

paths:
  state_dir: "state"
  artifacts_dir: "artifacts"
  logs_dir: "logs"
  credentials_dir: "credentials"

logging:
  level: "INFO"                # overridden by LOG_LEVEL env var
  log_file: "logs/pipeline.log"
  max_bytes: 10485760          # 10 MB
  backup_count: 5

creative_director:
  speaking_clip_index: 1   # 0-based index of the clip in each video that carries the spoken Italian voiceover. All other clips are silent (ambient room tone). Default 1 (the second clip in a 2-clip video; the middle clip in a 3-clip video).
  # clip_counts: [2, 3, 2]   # if you also want to override per-spec clip counts; uses default tuple if absent

dry_run: false                 # overridden by --dry-run CLI flag
